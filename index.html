<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>cute student planner</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        
<div class="container">
    
    <div class="main">

        <div class="header"><h1>my planner ♡</h1></div>

        <div class="cards">

            <div class="today-date">
                <h2 id="today-day"></h2>
                <h1 id="today-full-date"></h1>
                <p id="today-year"></p>
            </div>

            <div class="plan">todays plans</div>
            <div class="tasks-left">
                <h3>tasks left:<span id="task-count">0/0</span></h3>
                <div id="progress-bar">
                    <div id="progress-fill"></div>
                </div>
            </div>
        
        </div>
       <div class="mainbox">
        <div class="calendar">
            <div class="calendar-header">
                <button id="prev-month"> <-- </button>
                <h2 id="month-year"></h2>
                <button id="next-month"> --> </button>
            </div>
            <div class="calendar-grid" id="calendar-grid"></div>
            
        </div>
        <div id="event-form">
            <h3 id="selected-date">add a plan</h3>

            <input type="text" id="event-title">

            <button id="save-event">save event</button>
            <button id="cancel-event">cancel</button>
        </div>
        <div class="main-side">

                <div class="todolist">
                    <h2>to-do list</h2>
                    <ul id="tasks"></ul>
                    <button onclick="addTask()" id="addtask">+ add a task..</button>
                </div>

                <div class="notes">
                    <h2>notes</h2>
                    <textarea id="notes-content" placeholder="..."></textarea>


                </div>
            </div>
        </div>
    </div>
</div>

        
<script src="script.js"></script>
    </body>
    </html>
